<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>駅印帳 | Hokkaido Ekinori Project</title>
<meta name="description" content="北海道の駅にGPSで近づくと硬券風のスタンプが押せる、御朱印帳のような散歩きっぷアプリ" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
  rel="stylesheet"
/>

<link rel="stylesheet" href="css/styles.css" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script>
  (function () {
    var missing = [];
    if (typeof React === "undefined") missing.push("React");
    if (typeof ReactDOM === "undefined") missing.push("ReactDOM");
    if (typeof Babel === "undefined") missing.push("Babel");
    if (missing.length) {
      document.getElementById("root").innerHTML =
        '<div class="load-error"><p>読み込みに失敗しました(' +
        missing.join("、") +
        "が読み込めませんでした)。<br>ネットワーク制限や広告ブロッカーが原因の可能性があります。" +
        "別のネットワークやブラウザでもお試しください。</p></div>";
    }
  })();
</script>

<!-- アプリ本体(React + JSX)。Babel Standaloneがブラウザ上でJSXを変換します。 -->
<script type="text/babel" data-presets="react" src="js/app.js"></script>
</body>
</html>
