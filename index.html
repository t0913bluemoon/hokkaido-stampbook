window.storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    if (v == null) throw new Error("not found");
    return { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
};

// ---- ユーティリティ ---------------------------------------------------
function distanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function formatDistance(m) {
  if (m == null) return "—";
  if (m < 1000) return `${Math.round(m)}m`;
  return `${(m / 1000).toFixed(1)}km`;
}

function formatStampDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString("ja-JP", {
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
  });
}

function formatShortDate(iso) {
  const d = new Date(iso);
  const yy = String(d.getFullYear()).slice(2);
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${yy}.${mm}.${dd}`;
}

function hashRotation(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) {
    h = (h * 31 + id.charCodeAt(i)) % 1000;
  }
  return (h % 27) - 13; // -13 〜 13度
}

function polarPoint(r, angleDeg) {
  const a = ((angleDeg - 90) * Math.PI) / 180;
  return { x: 50 + r * Math.cos(a), y: 50 + r * Math.sin(a) };
}

function StampMark({ uid, name, dateLabel, rotation }) {
  const arcId = `arc-${uid}`;
  const filterId = `ink-${uid}`;
  const ticks = Array.from({ length: 16 }, (_, i) => i * (360 / 16));

  return (
    <div className="stamp-mark-wrap" style={{ transform: `rotate(${rotation}deg)` }}>
      <svg viewBox="0 0 100 100" width="74" height="74">
        <defs>
          <filter id={filterId} x="-30%" y="-30%" width="160%" height="160%">
            <feTurbulence
              type="fractalNoise"
              baseFrequency="0.85"
              numOctaves="2"
              seed={Math.abs(rotation) + 3}
              result="noise"
            />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" />
          </filter>
          <path id={arcId} d="M14,54 A38,38 0 0 1 86,54" fill="none" />
        </defs>
        <g filter={`url(#${filterId})`} fill="none" stroke="#BC3B2E">
          <circle cx="50" cy="50" r="45" strokeWidth="2.4" />
          <circle cx="50" cy="50" r="37" strokeWidth="1" />
          {ticks.map((angle, i) => {
            const p1 = polarPoint(41, angle);
            const p2 = polarPoint(44.5, angle);
            return <line key={i} x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y} strokeWidth="1" />;
          })}
        </g>
        <text fill="#BC3B2E" fontSize="9.5" fontFamily="'Kaisei Tokumin', serif" filter={`url(#${filterId})`}>
          <textPath href={`#${arcId}`} startOffset="50%" textAnchor="middle">
            {name}
          </textPath>
        </text>
        <text
          x="50"
          y="55"
          textAnchor="middle"
          fontFamily="'Courier Prime', monospace"
          fontSize="8"
          fill="#BC3B2E"
          filter={`url(#${filterId})`}

          fill="#BC3B2E"
          filter={`url(#${filterId})`}
        >
          {dateLabel}
        </text>
      </svg>
    </div>
  );
}

function StationStampBook() {
  const [stamps, setStamps] = useState({}); // { [stationId]: { stampedAt, lat, lng } }
  const [customStations, setCustomStations] = useState([]); // 自分で追加した駅・地点
  const [storageState, setStorageState] = useState("loading"); // loading | ready | error
  const [position, setPosition] = useState(null); // { lat, lng, accuracy }
  const [geoStatus, setGeoStatus] = useState("idle"); // idle | watching | denied | error | unsupported | timeout
  const [showDemo, setShowDemo] = useState(false);
  const [showAddForm, setShowAddForm] = useState(false);
  const [customName, setCustomName] = useState("");
  const [manualMode, setManualMode] = useState(false);
  const [manualLat, setManualLat] = useState("");
  const [manualLng, setManualLng] = useState("");
  const watchIdRef = useRef(null);
  const positionRef = useRef(null);

  // 保存データの読み込み
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const result = await window.storage.get(STORAGE_KEY, false);
        if (!cancelled) {
          const parsed = result ? JSON.parse(result.value) : { stamps: {}, customStations: [] };
          setStamps(parsed.stamps || {});
          setCustomStations(parsed.customStations || []);
          setStorageState("ready");
        }
      } catch (e) {
        if (!cancelled) {
          setStamps({});
          setCustomStations([]);
          setStorageState("ready"); // キー未作成時はエラーになるため空扱いで続行
        }
      }
    })();
    return () => {
      cancelled = true;
    };
  }, []);

  // 位置情報の監視開始
  useEffect(() => {
    if (!("geolocation" in navigator)) {
      setGeoStatus("unsupported");
      return;
    }
    setGeoStatus("watching");
    watchIdRef.current = navigator.geolocation.watchPosition(
      (pos) => {
        const next = {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          accuracy: pos.coords.accuracy,
        };
        positionRef.current = next;
        setPosition(next);
        setGeoStatus("watching");
      },
      (err) => {
        setGeoStatus(err.code === 1 ? "denied" : "error");
      },
      { enableHighAccuracy: true, maximumAge: 8000, timeout: 20000 }
    );
    const timeoutId = setTimeout(() => {
      if (!positionRef.current) {
        setGeoStatus((cur) => (cur === "watching" ? "timeout" : cur));
      }
    }, 12000);
    return () => {
      if (watchIdRef.current != null) {
        navigator.geolocation.clearWatch(watchIdRef.current);
      }
      clearTimeout(timeoutId);
    };
  }, []);

  const persist = useCallback(async (stampsObj, customArr) => {
    try {
      await window.storage.set(
        STORAGE_KEY,
        JSON.stringify({ stamps: stampsObj, customStations: customArr }),
        false
      );
    } catch (e) {
      console.error("save failed", e);
    }
  }, []);

  const handleStamp = (station, distance) => {
    if (distance == null || distance > STAMP_RADIUS_M) return;
    const next = {
      ...stamps,
      [station.id]: {
        stampedAt: new Date().toISOString(),
        lat: position?.lat,
        lng: position?.lng,
      },
    };
    setStamps(next);
    persist(next, customStations);
  };

  const handleAddCustomStation = () => {
    if (!customName.trim()) return;
    let lat, lng;
    if (manualMode) {
      lat = parseFloat(manualLat);
      lng = parseFloat(manualLng);
      if (Number.isNaN(lat) || Number.isNaN(lng)) return;
    } else {
      if (!position) return;
      lat = position.lat;
      lng = position.lng;
    }
    const id = `custom-${Date.now()}`;
    const next = [
      ...customStations,
      {
        id,
        name: customName.trim(),
        line: "カスタム",
        lat,
        lng,
        isCustom: true,
      },
    ];
    setCustomStations(next);
    persist(stamps, next);
    setCustomName("");
    setManualLat("");
    setManualLng("");
    setShowAddForm(false);
  };

  const handleDeleteCustomStation = (id) => {
    if (!window.confirm("この地点を削除しますか?押したスタンプも消えます。")) return;
    const nextCustom = customStations.filter((c) => c.id !== id);
    const nextStamps = { ...stamps };
    delete nextStamps[id];
    setCustomStations(nextCustom);
    setStamps(nextStamps);
    persist(nextStamps, nextCustom);
  };

  const allStations = [...STATIONS, ...customStations];

  const enriched = allStations.map((s) => {
    const distance = position ? distanceMeters(position.lat, position.lng, s.lat, s.lng) : null;
    return { ...s, distance, stamp: stamps[s.id] || null };
  });

  const uncollected = enriched
    .filter((s) => !s.stamp)
    .sort((a, b) => {
      if (a.distance == null && b.distance == null) return 0;
      if (a.distance == null) return 1;
      if (b.distance == null) return -1;
      return a.distance - b.distance;
    });

  const collected = enriched
    .filter((s) => s.stamp)
    .sort((a, b) => new Date(b.stamp.stampedAt) - new Date(a.stamp.stampedAt));

  const collectedCount = collected.length;
  const total = allStations.length;

  return (
    <div className="page">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&family=Kaisei+Tokumin:wght@500;700&family=Courier+Prime&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

        * { box-sizing: border-box; }
        .page {
          min-height: 100vh;
          background: #2A2118;
          background-image:
            radial-gradient(ellipse at top, rgba(255,255,255,0.04), transparent 60%);
          font-family: 'Zen Kaku Gothic New', sans-serif;
          color: #EDE3CC;
          padding: 20px 14px 48px;
        }
        .container { max-width: 480px; margin: 0 auto; }

        .header { margin-bottom: 16px; }

          font-family: 'Courier Prime', monospace;
          font-size: 11px;

        }
        .header h1 {
          font-family: 'Shippori Mincho', serif;

          font-size: 26px;
          margin: 4px 0 2px;
          color: #F4EBD8;
          letter-spacing: 0.06em;
          line-height: 1.3;
        }
        .header p {
          font-size: 12.5px;
          color: #B7A98A;
          margin: 0 0 10px;
        }
        .header-actions {
          display: flex;
          gap: 8px;
          flex-wrap: wrap;
        }
        .demo-toggle {
          font-family: 'Zen Kaku Gothic New', sans-serif;
          font-size: 11.5px;
          color: #F4EBD8;
          background: rgba(255,255,255,0.08);
          border: 1px solid rgba(255,255,255,0.18);
          border-radius: 20px;
          padding: 6px 12px;
        }
        .demo-toggle:active { transform: scale(0.97); }

        .add-form {
          margin-top: 10px;
          display: flex;
          gap: 6px;
          flex-wrap: wrap;
          align-items: center;
        }
        .add-input {
          flex: 1;
          min-width: 140px;
          background: rgba(255,255,255,0.08);
          border: 1px solid rgba(255,255,255,0.2);
          border-radius: 6px;

        .geo-card .icon { flex-shrink: 0; }
        .geo-card.warn { border-color: rgba(188,59,46,0.5); background: rgba(188,59,46,0.12); }
        .geo-mono { font-family: 'Courier Prime', monospace; color: #C9BFA8; }

        .section-label {
          font-family: 'Courier Prime', monospace;
          font-size: 11px;
          letter-spacing: 0.15em;
          color: #8C8069;
          margin: 22px 0 10px 4px;
          text-transform: uppercase;
        }

        .ticket {
          position: relative;
          display: flex;
          align-items: stretch;
          background: #EDE3CC;
          color: #2E2A24;
          border-radius: 6px;
          margin-bottom: 12px;
          overflow: hidden;
          box-shadow: 0 3px 8px rgba(0,0,0,0.35);
        }
        .ticket--stamped { min-height: 82px; }
        .ticket-stub {
          width: 10px;
          flex-shrink: 0;
          background-image: repeating-linear-gradient(
            to bottom,
            #2E2A24 0, #2E2A24 6px,
            transparent 6px, transparent 12px
          );
          background-color: transparent;
          position: relative;
        }
        .ticket-stub::before,
        .ticket-stub::after {
          content: "";
          position: absolute;
          left: -7px;
          width: 14px; height: 14px;
          background: #2A2118;
          border-radius: 50%;
        }
        .ticket-stub::before { top: -7px; }
        .ticket-stub::after { bottom: -7px; }

        .ticket-body {
          flex: 1;
          padding: 12px 12px 12px 14px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
        }
        .ticket-main { min-width: 0; }
        .line-chip {
          display: inline-flex;
          align-items: center;
          line-height: 1;
          font-size: 10px;
          font-family: 'Courier Prime', monospace;
          padding: 4px 8px 3px;
          border-radius: 20px;
          color: #fff;
          margin-bottom: 6px;
          letter-spacing: 0.02em;
          white-space: nowrap;
        }
        .station-name {
          font-family: 'Kaisei Tokumin', serif;
          font-weight: 700;
          font-size: 20px;
          line-height: 1.25;
        }
        .ticket-side {
          text-align: right;
          flex-shrink: 0;
        }
        .distance-readout {
          font-family: 'Courier Prime', monospace;
          font-size: 15px;
          color: #4A4438;
        }
        .in-range-tag {
          font-family: 'Courier Prime', monospace;
          font-size: 10.5px;
          color: #BC3B2E;
          font-weight: bold;
        }

        .stamp-btn {
          margin-top: 6px;
          font-family: 'Zen Kaku Gothic New', sans-serif;
          font-weight: 700;
          font-size: 12px;
          color: #fff;
          background: #BC3B2E;
          border: none;
          border-radius: 20px;
          padding: 6px 14px;
          animation: pulse 1.8s infinite;
        }
        .stamp-btn:active { transform: scale(0.96); }
        @keyframes pulse {
          0%, 100% { box-shadow: 0 0 0 0 rgba(188,59,46,0.5); }
          50% { box-shadow: 0 0 0 6px rgba(188,59,46,0); }
        }

        .ticket--stamped .ticket-body { opacity: 0.96; }
        .punch-hole {
          position: absolute;
          top: 8px;
          right: 8px;
          width: 16px;
          height: 16px;
          border-radius: 50%;
          background: #2A2118;
          box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
        }
        .stamp-mark-wrap {
          position: absolute;
          right: 6px;
          bottom: -2px;
          opacity: 0.88;
          mix-blend-mode: multiply;
          pointer-events: none;
        }

        .delete-btn {
          position: absolute;
          top: 6px;
          left: 6px;
          width: 20px;
          height: 20px;
          border-radius: 50%;
          background: rgba(0,0,0,0.08);
          border: none;
          color: #7A5C8E;
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 3;
        }
        .delete-btn:active { transform: scale(0.9); }

        .empty-note {
          font-size: 12.5px;
          color: #8C8069;
          padding: 10px 4px;
        }

        .footnote {
          margin-top: 28px;
          font-size: 11px;
          color: #6E6450;
          line-height: 1.6;
        }
      `}</style>

      <div className="container">
        <div className="header">
          <div className="eyebrow">Hokkaido Ekinori Project</div>
          <h1>途中下車 硬券帖</h1>
          <p>駅から{STAMP_RADIUS_M}m以内に近づくとスタンプが押せます。</p>
          <div className="header-actions">
            <button className="demo-toggle" onClick={() => setShowDemo((v) => !v)}>
              {showDemo ? "サンプルを閉じる" : "スタンプ後のサンプルを見る"}
            </button>
            <button
              className="demo-toggle"
              onClick={() => {
                setShowAddForm((v) => !v);
                setShowDemo(false);
              }}
            >
              {showAddForm ? "閉じる" : "＋ 自分の駅を追加"}
            </button>
          </div>
          {showAddForm && (
            <div className="add-form">
              <input
                className="add-input"
                type="text"
                placeholder="駅・地点の名前(例: 散歩きっぷ 第1停留所)"
                value={customName}
                onChange={(e) => setCustomName(e.target.value)}
              />
              {!manualMode && (
                <button
                  className="add-confirm"
                  disabled={!position || !customName.trim()}
                  onClick={handleAddCustomStation}
                >
                  現在地で登録
                </button>
              )}
              {!manualMode && !position && (
                <div className="add-hint">
                  現在地を取得中です。少し待ってから登録するか、下の「緯度経度を手動入力」をお試しください。
                </div>
              )}
              <button className="manual-toggle" onClick={() => setManualMode((v) => !v)}>
                {manualMode ? "現在地取得に戻す" : "緯度経度を手動入力する"}
              </button>
              {manualMode && (
                <div className="manual-fields">
                  <input
                    className="add-input manual-input"
                    type="text"
                    inputMode="decimal"
                    placeholder="緯度 例: 43.0686"
                    value={manualLat}
                    onChange={(e) => setManualLat(e.target.value)}
                  />
                  <input
                    className="add-input manual-input"
                    type="text"
                    inputMode="decimal"
                    placeholder="経度 例: 141.3508"
                    value={manualLng}
                    onChange={(e) => setManualLng(e.target.value)}
                  />
                  <button
                    className="add-confirm"
                    disabled={
                      !customName.trim() ||
                      Number.isNaN(parseFloat(manualLat)) ||
                      Number.isNaN(parseFloat(manualLng))
                    }
                    onClick={handleAddCustomStation}
                  >
                    この座標で登録
                  </button>
                  <div className="add-hint">
                    地図アプリで場所を長押しすると出てくる緯度経度をコピーして貼り付けられます。
                  </div>
                </div>
              )}
            </div>
          )}
        </div>

        {showDemo && (
          <div className="ticket ticket--stamped demo-ticket">
            <div className="demo-ribbon">PREVIEW</div>
            <div className="ticket-stub" />
            <div className="ticket-body">
              <div className="ticket-main">
                <span className="line-chip" style={{ background: LINES["カスタム"] }}>
                  サンプル
                </span>
                <div className="station-name">サンプル駅</div>
              </div>
              <div className="ticket-side">
                <div className="geo-mono" style={{ fontSize: 10.5 }}>
                  2026/08/03 14:12
                </div>
              </div>
            </div>
            <div className="punch-hole" />
            <StampMark uid="demo" name="サンプル駅" dateLabel="26.08.03" rotation={6} />
          </div>
        )}

        <div className="progress-row">
          <div className="progress-track">
            <div
              className="progress-fill"
              style={{ width: `${(collectedCount / total) * 100}%` }}
            />
          </div>
          <div className="progress-count">
            {collectedCount} / {total}
          </div>
        </div>

        {geoStatus === "watching" && (
          <div className="geo-card">
            <IconNavigation className="icon" size={16} color="#B8923A" />
            <span className="geo-mono">
              {position
                ? `現在地取得中 (精度 ±${Math.round(position.accuracy)}m)`
                : "現在地を取得しています…"}
            </span>
          </div>
        )}
        {geoStatus === "timeout" && (
          <div className="geo-card warn">
            <IconAlert className="icon" size={16} color="#BC3B2E" />
            <span>
              位置情報の取得に時間がかかっています。端末の位置情報の許可設定をご確認いただくか、「＋
              自分の駅を追加」内の緯度経度を手動入力からお試しください。
            </span>
          </div>
        )}
        {geoStatus === "denied" && (
          <div className="geo-card warn">
            <IconAlert className="icon" size={16} color="#BC3B2E" />
            <span>位置情報が許可されていません。ブラウザの設定から位置情報を許可してください。</span>
          </div>
        )}
        {(geoStatus === "error" || geoStatus === "unsupported") && (
          <div className="geo-card warn">
            <IconAlert className="icon" size={16} color="#BC3B2E" />
            <span>位置情報を取得できませんでした。屋外で電波の良い場所でお試しください。</span>
          </div>
        )}

        <div className="section-label">未収集・近い順</div>
        {uncollected.length === 0 && (
          <div className="empty-note">すべての駅を収集しました。</div>
        )}
        {uncollected.map((s) => {
          const inRange = s.distance != null && s.distance <= STAMP_RADIUS_M;
          return (
            <div className="ticket" key={s.id}>
              {s.isCustom && (
                <button className="delete-btn" onClick={() => handleDeleteCustomStation(s.id)}>
                  <IconX size={12} />
                </button>
              )}
              <div className="ticket-stub" />
              <div className="ticket-body">
                <div className="ticket-main">
                  <span
                    className="line-chip"
                    style={{ background: LINES[s.line] }}
                  >
                    {s.line}
                  </span>
                  <div className="station-name">{s.name}</div>
                </div>
                <div className="ticket-side">
                  <div className="distance-readout">{formatDistance(s.distance)}</div>
                  {inRange ? (
                    <>
                      <div className="in-range-tag">圏内</div>
                      <button
                        className="stamp-btn"
                        onClick={() => handleStamp(s, s.distance)}
                      >
                        スタンプを押す
                      </button>
                    </>
                  ) : (
                    <div className="in-range-tag" style={{ color: "#A79C82" }}>
                      —
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        })}

        <div className="section-label">収集済み</div>
        {collected.length === 0 && (
          <div className="empty-note">まだ収集した駅はありません。</div>
        )}
        {collected.map((s) => (
          <div className="ticket ticket--stamped" key={s.id}>
            {s.isCustom && (
              <button className="delete-btn" onClick={() => handleDeleteCustomStation(s.id)}>
                <IconX size={12} />
              </button>
            )}
            <div className="ticket-stub" />
            <div className="ticket-body">
              <div className="ticket-main">
                <span
                  className="line-chip"
                  style={{ background: LINES[s.line] }}
                >
                  {s.line}
                </span>
                <div className="station-name">{s.name}</div>
              </div>
              <div className="ticket-side">
                <div className="geo-mono" style={{ fontSize: 10.5 }}>
                  {formatStampDate(s.stamp.stampedAt)}
                </div>
              </div>
            </div>
            <div className="punch-hole" />
            <StampMark
              uid={s.id}
              name={s.name}
              dateLabel={formatShortDate(s.stamp.stampedAt)}
              rotation={hashRotation(s.id)}
            />
          </div>
        ))}

        <div className="footnote">
          <IconTrain size={12} style={{ verticalAlign: "-1px", marginRight: 4 }} />
          駅座標はおおよその位置です。スマホのGPS精度により、実際に駅へ到着してもすぐに反映されない場合があります。データはこの端末にのみ保存されます。
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<StationStampBook />);
</script>
</body>
</html>
